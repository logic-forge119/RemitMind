<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemitMind &bull; Sign In</title>
  <meta name="description" content="Sign in to RemitMind AI remittance intelligence & safety layer for upay. Global rate forecasting, explainable fraud radar, and agent liquidity.">
  
  <!-- Google Fonts: Outfit & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Core & Login Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page-body">

  <!-- Ambient AI Background Glow -->
  <div class="login-ambient-glow" aria-hidden="true"></div>

  <!-- Top Action Navigation -->
  <header class="login-top-bar">
    <a href="index.html" class="login-back-link" id="login-back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to RemitMind</span>
    </a>

    <!-- Theme Toggle (Light / Dark Mode) -->
    <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
      <span id="theme-icon-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </span>
    </button>
  </header>

  <!-- Main Login Card -->
  <main class="login-card-wrapper" id="login-card">
    
    <!-- LEFT PANEL: Animated World Map with Connecting Routes -->
    <section class="login-visual-panel" aria-label="Global Remittance Corridors">
      <div class="map-canvas-container">
        <canvas id="travel-map-canvas"></canvas>
      </div>

      <div class="login-visual-content">
        <!-- Floating Brand Icon Badge -->
        <div class="login-visual-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>

        <h2 class="login-visual-title">RemitMind</h2>
        <p class="login-visual-desc">AI-powered remittance intelligence, rate forecasting & fraud defense for upay</p>

        <!-- Live Telemetry Pill -->
        <div class="login-telemetry-pill">
          <span class="pulse-dot"></span>
          <span>Live Hubs: DXB • RUH • KUL • LHR ➔ DAC</span>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: Sign-In Form -->
    <section class="login-form-panel">
      <div class="login-header-group">
        <h1 class="login-heading">Welcome back</h1>
        <p class="login-subheading">Sign in to your account</p>
      </div>

      <!-- Google Sign In Button -->
      <button type="button" class="btn-google" id="btn-google-login">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Login with Google</span>
      </button>

      <!-- Divider -->
      <div class="login-divider">
        <span>or</span>
      </div>

      <!-- Sign In Form -->
      <form class="login-form" id="login-form" novalidate>
        
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">Email <span class="req">*</span></label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="login-input" 
              placeholder="gajiulislam@gmail.com" 
              value="gajiulislam@gmail.com"
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="req">*</span></label>
          <div class="input-wrapper input-has-action">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="login-input" 
              placeholder="Enter your password" 
              value="password123"
              required 
              autocomplete="current-password"
            >
            <button type="button" class="input-action-btn" id="toggle-password-btn" title="Show password" aria-label="Show password">
              <!-- Eye Icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options: Remember me & Forgot Password -->
        <div class="form-options-row">
          <label class="remember-label">
            <input type="checkbox" id="remember-me" class="remember-checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password-link" onclick="event.preventDefault(); alert('Password reset link sent to registered email.');">Forgot password?</a>
        </div>

        <!-- Submit Button with Shimmer Sweep and ArrowRight Icon -->
        <button type="submit" class="btn-submit-signin" id="btn-submit-signin">
          <span>Sign in</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="btn-shimmer-sweep" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Footer Info -->
      <div style="margin-top: 2rem; text-align: center; font-size: 0.825rem; color: var(--text-muted, #64748b);">
        <span>Don't have an account? </span>
        <a href="index.html#sandbox" style="color: #3b82f6; text-decoration: none; font-weight: 500;">Get started with Demo</a>
      </div>

    </section>
  </main>

  <!-- Interactive Script -->
  <script src="js/login.js"></script>
</body>
</html>
